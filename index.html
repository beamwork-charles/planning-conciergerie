<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planning Conciergerie · TB3 & TB4 · 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.07), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(20,184,166,.07), transparent 60%),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    min-height: 100vh;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
  }
  .glass {
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 4px 20px rgba(15,23,42,.04);
  }

  /* Person colors (--c: avatar, --cb: shift bar, --cl: light, --cd: dark) */
  .clr-emilie  { --c:#ec4899; --cb:#be185d; --cl:#fce7f3; --cd:#9d174d; }
  .clr-flora   { --c:#a855f7; --cb:#7e22ce; --cl:#f3e8ff; --cd:#6b21a8; }
  .clr-chiara  { --c:#14b8a6; --cb:#0f766e; --cl:#ccfbf1; --cd:#115e59; }
  .clr-cedric  { --c:#3b82f6; --cb:#1d4ed8; --cl:#dbeafe; --cd:#1e40af; }
  .clr-dynah   { --c:#f59e0b; --cb:#b45309; --cl:#fef3c7; --cd:#92400e; }
  .clr-charles { --c:#10b981; --cb:#047857; --cl:#d1fae5; --cd:#065f46; }
  .clr-none    { --c:#94a3b8; --cb:#475569; --cl:#f1f5f9; --cd:#334155; }

  .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .day-header {
    text-align: center; font-weight: 700; font-size: 11px; color: #64748b;
    padding: 8px 0 4px; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .day-cell {
    background: rgba(255,255,255,0.9);
    border-radius: 16px;
    padding: 10px;
    border: 1px solid #e2e8f0;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    position: relative;
    overflow: hidden;
  }
  .day-cell.weekend {
    background: repeating-linear-gradient(135deg, #f8fafc 0 8px, #f1f5f9 8px 16px);
    opacity: .5;
  }
  .day-cell.other-month { opacity: .4; }
  .day-cell.today { border: 2px solid #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,.12); }
  .day-cell.reduced { background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%); }
  .day-cell.holiday { background: linear-gradient(180deg, #fef2f2 0%, #fee2e2 100%); }
  .day-cell.past { filter: grayscale(0.65); opacity: 0.6; }
  .day-number { font-size: 18px; font-weight: 800; color: #0f172a; line-height: 1; }
  .day-cell.today .day-number { color: #2563eb; }

  .pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
    border-radius: 999px; font-size: 9px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.4px; line-height: 1;
  }
  .pill-reduced { background: #f59e0b; color: white; }
  .pill-holiday { background: #ef4444; color: white; }

  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .day-name { display: none; font-weight: 600; color: #64748b; text-transform: capitalize; }
  .day-buildings { display: flex; flex-direction: column; gap: 9px; }
  .bld-card { display: flex; flex-direction: column; gap: 4px; border: 1px solid #e2e8f0; border-radius: 12px; padding: 7px 7px 8px; }
  .bld-card.tb3 { background: rgba(238,242,255,0.8); border-color: #c7d2fe; }
  .bld-card.tb4 { background: rgba(240,253,250,0.85); border-color: #99f6e4; }
  .bld-label {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px;
    padding-left: 2px; margin-bottom: 2px; display: flex; align-items: center; gap: 5px;
  }
  .bld-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .bld-card.tb3 .bld-label { color: #4f46e5; }
  .bld-card.tb3 .bld-label::before { background: #6366f1; }
  .bld-card.tb4 .bld-label { color: #0d9488; }
  .bld-card.tb4 .bld-label::before { background: #14b8a6; }
  .shift-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 8px;
    background: var(--cb, #475569); color: white;
    font-size: 12.5px; font-weight: 600; min-height: 28px; line-height: 1.1;
  }
  .shift-bar .when {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.6px; opacity: 0.85; flex-shrink: 0;
  }
  .shift-bar .name-wrap { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; text-align: right; }
  .shift-bar .name { font-weight: 700; font-size: 13px; }
  .shift-bar .sub-note { font-size: 9px; font-weight: 600; opacity: 0.9; }
  .shift-bar.is-sub .when::before { content: '⚡'; margin-right: 3px; opacity: 0.95; }
  .shift-bar.is-none { background: repeating-linear-gradient(45deg, #fca5a5 0 8px, #ef4444 8px 16px); }

  /* OFF row : concierge absent affiché grisé barré sous les shifts */
  .off-row {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 7px;
    background: #f1f5f9; border: 1px dashed #cbd5e1;
    font-size: 11px; min-height: 22px; margin-top: 1px;
  }
  .off-row .off-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--c, #94a3b8); opacity: .5; flex-shrink: 0;
  }
  .off-row .off-name {
    font-weight: 700; color: #64748b;
    text-decoration: line-through; text-decoration-color: #94a3b8;
  }
  .off-row .off-tag {
    margin-left: auto; font-size: 9px; font-weight: 800; letter-spacing: .5px;
    color: #475569; background: #e2e8f0; padding: 1px 6px; border-radius: 4px;
  }

  .extra-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .extra-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 7px;
    font-size: 10.5px; font-weight: 700; line-height: 1.2;
    color: var(--cd); background: var(--cl);
    border: 1px dashed color-mix(in srgb, var(--c) 50%, transparent);
  }

  /* Managers strip (bottom of day cell) */
  .mng-row {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
    padding-top: 6px; border-top: 1px dashed #e2e8f0;
  }
  .mng-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 700; line-height: 1.2;
  }
  .mng-chip::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .mng-chip.on  { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .mng-chip.on::before  { background: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,.18); }
  .mng-chip.off { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; text-decoration: line-through; text-decoration-color: #94a3b8; }
  .mng-chip.off::before { background: #cbd5e1; }
  .mng-chip.off::after  { content: ' · OFF'; text-decoration: none; font-weight: 800; letter-spacing: .3px; }

  .warning-flag {
    position: absolute; top: 8px; right: 8px; width: 18px; height: 18px;
    background: #ef4444; color: white; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; box-shadow: 0 4px 8px rgba(239,68,68,.3);
  }

  .collab-card {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 10px; background: white; border: 1px solid #e2e8f0;
  }
  .collab-avatar {
    width: 34px; height: 34px; border-radius: 10px; background: var(--c); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; flex-shrink: 0;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,.4);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 50; display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: fade .2s ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal-card {
    background: white; border-radius: 22px; max-width: 600px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(15,23,42,.25);
    animation: pop .25s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Leave form */
  .leave-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .lbl { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .4px; }
  .leave-input {
    width: 100%; margin-top: 4px; padding: 9px 11px; border-radius: 10px;
    border: 1px solid #cbd5e1; font-size: 14px; font-family: inherit; background: white;
  }
  .leave-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .leave-remove {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid #fecaca; background: #fef2f2; color: #ef4444;
    font-size: 18px; font-weight: 700; cursor: pointer; line-height: 1;
  }
  .leave-remove:hover { background: #fee2e2; }

  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; border: 2px solid transparent; }

  .hidden { display: none !important; }

  @media print {
    body { background: white; }
    .no-print { display: none !important; }
    .day-cell { break-inside: avoid; }
    .calendar-grid { gap: 4px; }
    .glass { background: white; backdrop-filter: none; box-shadow: none; }
  }
  @media (max-width: 1100px) { aside.sidebar { order: -1; } }
  /* Grand desktop → laptop : on resserre la grille 7 colonnes */
  @media (max-width: 1280px) and (min-width: 901px) {
    .day-cell { min-height: 170px; padding: 7px; gap: 5px; }
    .day-number { font-size: 15px; }
    .shift-bar { font-size: 11px; min-height: 22px; padding: 4px 7px; gap: 4px; }
    .shift-bar .when { font-size: 9px; }
    .shift-bar .name { font-size: 11px; }
    .shift-bar .sub-note { font-size: 8.5px; }
    .bld-label { font-size: 9px; }
    .bld-card { padding: 5px; }
    .off-row { font-size: 10px; padding: 2px 7px; min-height: 18px; }
    .mng-chip { font-size: 9px; padding: 1px 6px; }
  }
  /* Tablette & mobile : vue agenda — 1 jour par ligne, plein largeur */
  @media (max-width: 900px) {
    .calendar-grid { grid-template-columns: 1fr; gap: 8px; }
    .day-header { display: none; }
    .day-cell { min-height: 0; padding: 12px 14px; gap: 10px; }
    .day-cell.other-month { display: none; }
    .day-name { display: inline; margin-right: 8px; font-size: 14px; }
    .day-number { font-size: 18px; }
    .day-cell.weekend, .day-cell.holiday {
      flex-direction: row; align-items: center; padding: 10px 16px; gap: 12px;
    }
    .day-cell.weekend > div:last-child, .day-cell.holiday > div:last-child { margin: 0; }
    /* TB3 et TB4 côte à côte */
    .day-buildings { flex-direction: row; gap: 8px; }
    .day-buildings .bld-card { flex: 1; min-width: 0; padding: 8px; }
    .shift-bar { font-size: 12px; min-height: 26px; padding: 5px 9px; }
    .shift-bar .name { font-size: 12px; }
    .shift-bar .when { font-size: 10px; }
    .off-row { font-size: 11px; }
    .mng-chip { font-size: 10.5px; padding: 2px 8px; }
    /* Header plus compact */
    header.glass { padding: 10px 12px; }
    header.glass h1 { font-size: 15px; }
    header.glass p { font-size: 11px; }
    /* Modal congé */
    .leave-row { flex-wrap: wrap; }
    .leave-row > div { min-width: calc(50% - 28px); }
  }
  button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; border-radius: 8px; }

  /* Lock screen */
  .lock-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
    z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .lock-card {
    background: white; border-radius: 24px; padding: 36px 32px; max-width: 380px; width: 100%;
    box-shadow: 0 24px 64px rgba(0,0,0,.4); text-align: center;
  }
  .lock-input {
    width: 100%; padding: 12px 16px; border-radius: 12px; border: 2px solid #e2e8f0;
    font-size: 16px; font-weight: 600; outline: none; transition: border-color .15s; font-family: inherit;
  }
  .lock-input:focus { border-color: #3b82f6; }
  .lock-btn {
    width: 100%; padding: 12px; background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
    color: white; font-weight: 800; border-radius: 12px; border: none; font-size: 15px; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .lock-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,.4); }
  .lock-error { color: #ef4444; font-size: 13px; font-weight: 600; margin-top: 8px; min-height: 18px; }
</style>
</head>

<script>
/* ============================================================
   Planning Conciergerie · TB3 & TB4 — affichage en lecture seule
   Données + helpers partagés : voir data.js
   ============================================================ */

// Accès protégé + données + helpers : voir data.js
setupGate();

// ----- State -----
let currentMonth = today.getMonth(), currentYear = today.getFullYear();
// Planning : historique limité aux 3 derniers mois (glissant par rapport au mois courant)
const mIdx = (y, m) => y * 12 + m;
const PLANNING_FLOOR = mIdx(today.getFullYear(), today.getMonth()) - 3;
if (mIdx(currentYear, currentMonth) < PLANNING_FLOOR) { currentYear = Math.floor(PLANNING_FLOOR / 12); currentMonth = PLANNING_FLOOR % 12; }
function atMin() { return mIdx(currentYear, currentMonth) <= PLANNING_FLOOR; }

// ----- Schedule generation (helpers de dates : voir data.js) -----
function genDay(date) {
  const dateStr = fmt(date);
  const dow = date.getDay();
  const isWeekend = (dow === 0 || dow === 6);
  const holiday = isHoliday(date);
  if (isWeekend || holiday) return { date: dateStr, isWeekend, holiday, off: true };

  const parity = getWeekParity(date);
  const reduced = isReducedDay(date);
  const morningTB3 = parity === 0 ? 'Flora' : 'Emilie';
  const eveningTB3 = parity === 0 ? 'Emilie' : 'Flora';
  const morningTB4 = parity === 0 ? 'Cédric' : 'Chiara';
  const eveningTB4 = parity === 0 ? 'Chiara' : 'Cédric';

  let schedule;
  if (reduced) {
    schedule = {
      date: dateStr, reduced: true, holiday: null, isWeekend: false,
      TB3: { slots: BUILDING_CONCIERGES.TB3.map(p => mkShift('9h-17h', p)) },
      TB4: { slots: BUILDING_CONCIERGES.TB4.map(p => mkShift('9h-17h', p)) }
    };
  } else {
    schedule = {
      date: dateStr, reduced: false, holiday: null, isWeekend: false,
      TB3: { morning: mkShift('8h-16h', morningTB3), evening: mkShift('11h-19h', eveningTB3) },
      TB4: { morning: mkShift('8h-16h', morningTB4), evening: mkShift('11h-19h', eveningTB4) }
    };
  }

  const absentToday = new Set();
  for (const p of Object.keys(COLLABORATORS)) if (isAbsent(p, dateStr)) absentToday.add(p);
  applySubs(schedule, absentToday);
  applyOverrides(schedule, dateStr);
  schedule.dynah   = computeStatus('Dynah', schedule, absentToday);
  schedule.charles = computeStatus('Charles', schedule, absentToday);
  schedule.warnings = collectWarnings(schedule);
  return schedule;
}
function mkShift(time, person) { return { time, person, defaultPerson: person, swapped: false, substituteFor: null }; }
function applyOverrides(schedule, dateStr) {
  const ov = OVERRIDES[dateStr];
  if (!ov) return;
  for (const b of ['TB3','TB4']) {
    if (!ov[b]) continue;
    for (const slot of ['morning','evening']) {
      const o = ov[b][slot];
      if (o && schedule[b][slot]) {
        schedule[b][slot].person = o.person ?? null;
        schedule[b][slot].substituteFor = o.substituteFor ?? null;
      }
    }
    if (ov[b].slots && schedule[b].slots) {
      schedule[b].slots = ov[b].slots.map(o => {
        const sh = mkShift('9h-17h', o.person ?? null);
        sh.substituteFor = o.substituteFor ?? null;
        return sh;
      });
    }
  }
}

function applySubs(schedule, absentToday) {
  // Un renfort ne peut couvrir qu'un seul shift par jour → on suit ceux déjà placés
  const usedRenforts = new Set();
  const pickRenfort = () => {
    for (const r of ['Dynah', 'Charles']) {
      if (!absentToday.has(r) && !usedRenforts.has(r)) { usedRenforts.add(r); return r; }
    }
    return null;
  };
  if (schedule.reduced) {
    for (const b of ['TB3','TB4']) {
      const blk = schedule[b];
      const present = blk.slots.filter(s => !absentToday.has(s.person));
      if (present.length === 0) {
        // Les 2 concierges absents → un renfort assure le 9h-17h
        const slot = mkShift('9h-17h', pickRenfort());
        slot.substituteFor = blk.slots[0].person;
        blk.slots = [slot];
      } else {
        // Un (ou deux) concierge(s) présent(s) assurent — pas de renfort
        blk.slots = present;
      }
    }
  } else {
    // Règle simple : le renfort prend directement le shift de l'absent, l'autre concierge ne bouge pas
    for (const b of ['TB3','TB4']) {
      const blk = schedule[b];
      for (const slot of ['morning', 'evening']) {
        const s = blk[slot];
        if (absentToday.has(s.person)) {
          s.substituteFor = s.person;
          s.person = pickRenfort();
        }
      }
    }
  }
}
function computeStatus(person, schedule, absentToday) {
  if (absentToday.has(person)) return 'cp';
  for (const b of ['TB3','TB4']) {
    const blk = schedule[b];
    if (blk.slots) { if (blk.slots.some(s => s.person === person)) return 'shift'; }
    if (blk.morning && blk.morning.person === person) return 'shift';
    if (blk.evening && blk.evening.person === person) return 'shift';
  }
  return 'present';
}
function collectWarnings(sch) {
  const warns = [];
  for (const b of ['TB3','TB4']) {
    const blk = sch[b];
    if (blk.slots) { if (blk.slots.some(s => !s.person)) warns.push(`${b} : aucun concierge ni remplaçant (9h-17h)`); }
    else {
      if (!blk.morning.person) warns.push(`${b} matin : aucun remplaçant`);
      if (!blk.evening.person) warns.push(`${b} soir : aucun remplaçant`);
      if (blk.morning.person && blk.morning.person === blk.evening.person) warns.push(`${b} : ${SN(blk.morning.person)} sur matin ET soir`);
    }
  }
  return warns;
}

// ----- Rendering -----
function render() {
  renderHeader(); renderCalendar(); renderStatusLine();
  document.getElementById('prev-btn').style.visibility = atMin() ? 'hidden' : 'visible';
}
function renderHeader() { document.getElementById('period-label').textContent = `${MONTHS_FR[currentMonth]} ${currentYear}`; }
function renderStatusLine() {
  const first = new Date(currentYear, currentMonth, 1), last = new Date(currentYear, currentMonth + 1, 0);
  let reducedInMonth = false;
  for (let d = new Date(first); d <= last; d.setDate(d.getDate()+1)) if (isReducedDay(d)) { reducedInMonth = true; break; }
  document.getElementById('status-line').innerHTML = reducedInMonth
    ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-amber-50 text-amber-800 border border-amber-200 font-semibold">🕘 Horaires réduits ce mois</span>` : '';
}

function renderCalendar() {
  const container = document.getElementById('calendar');
  const firstDay = new Date(currentYear, currentMonth, 1), lastDay = new Date(currentYear, currentMonth + 1, 0);
  const startDate = new Date(firstDay); startDate.setDate(startDate.getDate() - ((startDate.getDay() + 6) % 7));
  const endDate = new Date(lastDay); endDate.setDate(endDate.getDate() + (6 - ((endDate.getDay() + 6) % 7)));

  let html = '<div class="calendar-grid mb-1">';
  for (const lbl of ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim']) html += `<div class="day-header">${lbl}</div>`;
  html += '</div><div class="calendar-grid">';
  for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate()+1)) {
    html += renderDayCell(d, d.getMonth() === currentMonth, d.getTime() === today.getTime());
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderDayCell(date, isCurrent, isToday) {
  const sch = genDay(date);
  const dayNum = date.getDate();
  let cls = ['day-cell'];
  if (sch.isWeekend) cls.push('weekend');
  if (sch.holiday) cls.push('holiday');
  if (!isCurrent) cls.push('other-month');
  if (isToday) cls.push('today');
  if (sch.reduced) cls.push('reduced');
  if (date.getTime() < today.getTime()) cls.push('past');

  let html = `<div class="${cls.join(' ')}">`;
  if (sch.warnings && sch.warnings.length) html += `<div class="warning-flag" title="${sch.warnings.join(' · ')}">!</div>`;

  const dayName = DAYS_FR[date.getDay()];
  html += `<div class="day-head"><span class="day-number"><span class="day-name">${dayName}</span>${dayNum}</span><div class="flex items-center gap-1 flex-wrap justify-end">`;
  if (sch.reduced && !sch.isWeekend && !sch.holiday) html += `<span class="pill pill-reduced">9h–17h</span>`;
  if (sch.holiday) html += `<span class="pill pill-holiday">Férié</span>`;
  html += `</div></div>`;

  if (sch.isWeekend) return html + `<div class="text-[11px] text-slate-400 italic mt-2">Weekend</div></div>`;
  if (sch.holiday)   return html + `<div class="text-[11px] text-red-600 font-semibold mt-1">${sch.holiday}</div></div>`;

  html += `<div class="day-buildings">`;
  html += renderBuildingMini('TB3', sch.TB3, sch.date);
  html += renderBuildingMini('TB4', sch.TB4, sch.date);
  html += `</div>`;
  html += renderManagers(sch.date);
  html += `</div>`;
  return html;
}

function renderManagers(dateStr) {
  const managers = ['Charles', 'Dynah'];
  const chips = managers.map(p => {
    const off = isAbsent(p, dateStr);
    const nm = SN(p);
    return `<span class="mng-chip ${off ? 'off' : 'on'}" title="${nm} — ${off ? 'OFF' : 'présent'}">${nm}</span>`;
  }).join('');
  return `<div class="mng-row" aria-label="Managers">${chips}</div>`;
}

function renderBuildingMini(name, blk, dateStr) {
  let html = `<div class="bld-card ${name.toLowerCase()}"><div class="bld-label">${name}</div>`;
  if (blk.slots) html += blk.slots.map(s => renderShiftBar(s, '9h-17h')).join('');
  else { html += renderShiftBar(blk.morning, blk.morning.time); html += renderShiftBar(blk.evening, blk.evening.time); }
  html += renderOffRows(name, dateStr);
  html += renderExtraHours(dateStr, name);
  return html + `</div>`;
}
function renderOffRows(building, dateStr) {
  const absent = BUILDING_CONCIERGES[building].filter(p => isAbsent(p, dateStr));
  if (!absent.length) return '';
  return absent.map(p => {
    const meta = COLLABORATORS[p];
    return `<div class="off-row clr-${meta.color}" title="${meta.shortName} — absent ce jour">
      <span class="off-dot"></span><span class="off-name">${meta.shortName}</span><span class="off-tag">OFF</span></div>`;
  }).join('');
}
function renderShiftBar(shift, label) {
  const meta = shift.person ? COLLABORATORS[shift.person] : null;
  const colorClass = meta ? `clr-${meta.color}` : 'clr-none';
  const nm = meta ? meta.shortName : '⚠️ Aucun';
  const sub = shift.substituteFor ? `<span class="sub-note">remplace ${SN(shift.substituteFor)}</span>` : '';
  return `<div class="shift-bar ${colorClass} ${shift.substituteFor ? 'is-sub' : ''} ${!shift.person ? 'is-none' : ''}">
      <span class="when">${label}</span><span class="name-wrap"><span class="name">${nm}</span>${sub}</span></div>`;
}
function renderExtraHours(dateStr, building) {
  const list = (EXTRA_HOURS[dateStr] || []).filter(e => (e.building || COLLABORATORS[e.person]?.building) === building);
  if (!list.length) return '';
  const chips = list.map(e => {
    const meta = COLLABORATORS[e.person];
    const cls = meta ? `clr-${meta.color}` : 'clr-none';
    const name = meta ? meta.shortName : e.person;
    const hrs = e.hours ? ` (+${e.hours}h)` : '';
    return `<span class="extra-chip ${cls}">⏱ ${name} · ${e.label}${hrs}</span>`;
  }).join('');
  return `<div class="extra-row">${chips}</div>`;
}

// ============================================================
// DEMANDE DE CONGÉ — prépare un email (mailto) + alerte chevauchement
// ============================================================
const LEAVE_TO = 'charles@thebureau.paris';
let leavePeriods = [{ start: '', end: '' }];
// todayStr : voir data.js

function openLeaveModal(preset) {
  leavePeriods = [{ start: '', end: '' }];
  const html = `
    <div class="px-6 pt-6 pb-4 border-b border-slate-200 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-t-[22px]">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-xs font-bold uppercase tracking-wider opacity-90">Conciergerie</div>
          <h2 class="text-2xl font-extrabold leading-tight mt-0.5">🌴 Demande de congé</h2>
          <div class="text-xs opacity-90 mt-1">Préparez votre demande — elle sera envoyée par email à Charles.</div>
        </div>
        <button onclick="closeModal('leave-modal')" class="text-white/80 hover:text-white text-3xl leading-none" aria-label="Fermer">×</button>

        </select>
      </div>
      <div>

      </div>
      <div>
        <label class="lbl">Message (facultatif)</label>
        <textarea id="leave-msg" rows="2" class="leave-input" placeholder="Précision éventuelle…"></textarea>
      </div>

      <div class="space-y-2 pt-1">
        <button id="leave-gmail" class="w-full px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold flex items-center justify-center gap-2">📧 Ouvrir dans Gmail</button>
        <button id="leave-copy" class="w-full px-4 py-2 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-sm font-semibold flex items-center justify-center gap-2">📋 Copier le message</button>
        <div class="text-center pt-1"><button id="leave-mailto" class="text-xs font-semibold text-slate-400 hover:text-slate-600 underline">ou ouvrir dans votre application mail</button></div>

  document.getElementById('leave-modal-content').innerHTML = html;
  renderLeaveRows();

  document.getElementById('leave-person').addEventListener('change', updateLeavePreview);
  document.getElementById('leave-add').addEventListener('click', () => {
    syncLeaveFromDOM(); leavePeriods.push({ start: '', end: '' }); renderLeaveRows(); updateLeavePreview();
  });
  const pc = document.getElementById('leave-periods');
  pc.addEventListener('input', (e) => {
    if (e.target.classList.contains('leave-start')) {
      const i = e.target.dataset.i;
      const endEl = pc.querySelector(`.leave-end[data-i="${i}"]`);
      // Synchronise la date de fin sur la date de début si elle est vide ou antérieure :
      // évite à l'utilisateur de naviguer à nouveau jusqu'au bon mois pour une journée simple.
      if (endEl && (!endEl.value || endEl.value < e.target.value)) endEl.value = e.target.value;
    }
    updateLeavePreview();
  });
  pc.addEventListener('click', (e) => {
    if (e.target.classList.contains('leave-remove')) {
      syncLeaveFromDOM();
      leavePeriods.splice(+e.target.dataset.i, 1);
      if (!leavePeriods.length) leavePeriods = [{ start: '', end: '' }];
      renderLeaveRows(); updateLeavePreview();
    }
  });
  document.getElementById('leave-gmail').addEventListener('click', openGmail);
  document.getElementById('leave-copy').addEventListener('click', (ev) => copyLeaveContent(ev.currentTarget));

  if (preset) document.getElementById('leave-person').value = preset;

}

function renderLeaveRows() {
  document.getElementById('leave-periods').innerHTML = leavePeriods.map((p, i) => `
    <div class="leave-row" data-i="${i}">
      <div class="flex-1"><label class="lbl">Du</label><input type="date" class="leave-input leave-start" data-i="${i}" value="${p.start}" min="${todayStr}"></div>
      <div class="flex-1"><label class="lbl">Au</label><input type="date" class="leave-input leave-end" data-i="${i}" value="${p.end}" min="${todayStr}"></div>
      <button type="button" class="leave-remove" data-i="${i}" ${leavePeriods.length === 1 ? 'style="visibility:hidden"' : ''} aria-label="Retirer">×</button>
    </div>`).join('');
}
function syncLeaveFromDOM() {
  document.querySelectorAll('#leave-periods .leave-row').forEach(row => {
    const i = +row.dataset.i;
    leavePeriods[i] = { start: row.querySelector('.leave-start').value, end: row.querySelector('.leave-end').value };
  });
}
function collectDates(periods) {
  const set = new Set();
  for (const p of periods) {
    if (!p.start) continue;
    const end = (p.end && p.end >= p.start) ? p.end : p.start;
    for (const d of range(p.start, end)) set.add(d);
  }
  return [...set].sort();
}
// Pour chaque date demandée : qui est déjà absent ce jour-là (hors demandeur) ?
function dayCoverage(requester, dateStr) {
  const role = COLLABORATORS[requester]?.role;
  const reqRenf = role === 'renfort'   ? 1 : 0;
  const reqConc = role === 'concierge' ? 1 : 0;
  const absentRenforts = [], absentConcierges = [];
  for (const p of Object.keys(COLLABORATORS)) {
    if (p === requester) continue;
    if (!isAbsent(p, dateStr)) continue;
    if (COLLABORATORS[p].role === 'renfort')  absentRenforts.push(p);
    else if (COLLABORATORS[p].role === 'concierge') absentConcierges.push(p);
  }
  const renfAvailable = 2 - absentRenforts.length - reqRenf;
  const need = absentConcierges.length + reqConc;
  return { absentRenforts, absentConcierges, renfAvailable, need, reqRenf, reqConc };
}
// Couverture IMPOSSIBLE (rouge) : pas assez de renforts pour couvrir les concierges absents + le demandeur
function leaveBlockers(requester, dates) {
  const out = [];
  for (const d of dates) {
    if (!isWorkday(parseD(d))) continue;
    const c = dayCoverage(requester, d);
    if (c.renfAvailable < c.need) out.push({ date: d, ...c });
  }
  return out;
}
// Couverture TENDUE (orange) : pile équilibrée — les 2 renforts seront mobilisés, demande très probablement refusée
function leaveTight(requester, dates) {
  const out = [];
  for (const d of dates) {
    if (!isWorkday(parseD(d))) continue;
    const c = dayCoverage(requester, d);
    if (c.renfAvailable === c.need && c.need > 0 && (c.absentRenforts.length + c.absentConcierges.length) > 0) {
      out.push({ date: d, ...c });
    }
  }
  return out;
}
function joinNames(arr) {
  const names = arr.map(SN);
  if (names.length <= 1) return names.join('');
  return names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
}
function tightReason(c) {
  if (c.absentConcierges.length) {
    return `${joinNames(c.absentConcierges)} déjà absent·e — les 2 renforts (Dynah & Charles) seront mobilisés`;
  }
  if (c.absentRenforts.length) {
    const otherRenf = c.absentRenforts.includes('Dynah') ? 'Charles' : 'Dynah';
    return `${joinNames(c.absentRenforts)} (renfort) déjà absent·e — ${otherRenf} sera mobilisé pour vous remplacer`;
  }
  return 'couverture pile équilibrée';
}
function blockerReason(b) {
  const renf = b.absentRenforts, conc = b.absentConcierges;
  if (renf.length === 2) {
    return `Dynah & Charles (les 2 renforts) déjà absents — plus aucun renfort disponible`;
  }
  if (renf.length === 1 && conc.length >= 1) {
    const otherRenf = renf[0] === 'Dynah' ? 'Charles' : 'Dynah';
    return `${SN(renf[0])} (renfort) et ${joinNames(conc)} déjà absent·e·s — ${otherRenf} est déjà mobilisé pour le remplacement`;
  }
  const all = [...renf, ...conc];
  return `${joinNames(all)} déjà absent·e·s — plus assez de renforts pour vous remplacer`;
}
// Vrai si au moins une date demandée est à moins de 7 jours d'aujourd'hui
function hasShortNotice(dates) {
  for (const d of dates) {
    if (daysBetween(today, parseD(d)) < 7) return true;
  }
  return false;
}
function updateLeavePreview() {
  syncLeaveFromDOM();
  const requester = document.getElementById('leave-person').value;
  const dates = collectDates(leavePeriods);
  const box = document.getElementById('leave-preview');
  if (!dates.length) { box.innerHTML = `<div class="text-sm text-slate-400">Sélectionnez au moins une date pour voir le récapitulatif.</div>`; return; }
  const working = dates.filter(d => isWorkday(parseD(d))).length;
  const shortNotice = hasShortNotice(dates);
  const blockers = leaveBlockers(requester, dates);
  const tight    = leaveTight(requester, dates);
  const hasIssue = shortNotice || blockers.length || tight.length;
  let tone;
  if (blockers.length) tone = 'bg-red-50 border-red-200';
  else if (hasIssue)   tone = 'bg-amber-50 border-amber-200';
  else                 tone = 'bg-emerald-50 border-emerald-200';
  let html = `<div class="rounded-xl border p-3 ${tone}"><div class="text-sm font-bold mb-1">${dates.length} jour(s) demandé(s) · ${working} ouvré(s)</div>`;
  if (!hasIssue) {
    html += `<div class="text-sm text-emerald-700">✅ Sous réserve de validation, cela ne devrait pas poser de problème.</div>`;
  } else {
    if (blockers.length) {
      html += `<div class="text-sm text-red-800 font-semibold mb-1">⛔ Congé impossible sur ces jours :</div>`;
      html += `<ul class="text-xs space-y-1 text-red-800 mb-2">`;
      html += blockers.map(b => `<li><span class="font-semibold">${fmtFR(b.date)}</span> — ${blockerReason(b)}</li>`).join('');
      html += `</ul>`;
    }
    if (tight.length) {
      html += `<div class="text-sm text-amber-800 font-semibold ${blockers.length ? 'mt-2 ' : ''}mb-1">⚠️ Couverture tendue — demande très probablement refusée :</div>`;
      html += `<ul class="text-xs space-y-1 text-amber-800">`;
      html += tight.map(t => `<li><span class="font-semibold">${fmtFR(t.date)}</span> — ${tightReason(t)}</li>`).join('');
      html += `</ul>`;
    }
    if (shortNotice) {
      html += `<div class="text-sm text-amber-800 font-semibold ${(blockers.length || tight.length) ? 'mt-2 ' : ''}mb-1">⏰ Demande à moins de 7 jours — cela peut compliquer l'organisation du planning.</div>`;
    }
  }
  return box.innerHTML = html + `</div>`;
}
function getLeaveEmail() {
  syncLeaveFromDOM();
  const requester = document.getElementById('leave-person').value;
  const name = COLLABORATORS[requester].shortName;
  const msg = document.getElementById('leave-msg').value.trim();
  const dates = collectDates(leavePeriods);
  if (!dates.length) { alert('Indiquez au moins une date.'); return null; }
  const working = dates.filter(d => isWorkday(parseD(d))).length;
  const periodLines = leavePeriods.filter(p => p.start).map(p => {
    const end = (p.end && p.end >= p.start) ? p.end : p.start;
    return p.start === end ? `- le ${fmtFR(p.start)}` : `- du ${fmtFR(p.start)} au ${fmtFR(end)}`;
  });
  let body = `Bonjour Charles,\n\nJe souhaite poser des congés :\n${periodLines.join('\n')}\n\nTotal : ${dates.length} jour(s), dont ${working} jour(s) ouvré(s).\n`;
  const blockers = leaveBlockers(requester, dates);
  const tight    = leaveTight(requester, dates);
  if (blockers.length) {
    body += `\n⛔ Congé a priori impossible sur ces jours :\n`;
    body += blockers.map(b => `- ${fmtFR(b.date)} : ${blockerReason(b)}`).join('\n') + '\n';
  }
  if (tight.length) {
    body += `\n⚠️ Couverture tendue — demande très probablement refusée :\n`;
    body += tight.map(t => `- ${fmtFR(t.date)} : ${tightReason(t)}`).join('\n') + '\n';
  }
  if (hasShortNotice(dates)) {
    body += `\n⏰ Demande à moins de 7 jours — cela peut compliquer l'organisation du planning.\n`;
  }
  if (msg) body += `\nMessage : ${msg}\n`;
  body += `\nBien cordialement,\n${name}`;
  return { to: LEAVE_TO, subject: `Demande de congés — ${name}`, body };
}

function openGmail() {
  const e = getLeaveEmail(); if (!e) return;
  const url = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(e.to)}&su=${encodeURIComponent(e.subject)}&body=${encodeURIComponent(e.body)}`;
  window.open(url, '_blank', 'noopener');
}

function openMailto() {
  const e = getLeaveEmail(); if (!e) return;
  window.location.href = `mailto:${e.to}?subject=${encodeURIComponent(e.subject)}&body=${encodeURIComponent(e.body)}`;
}

async function copyLeaveContent(btn) {
  const e = getLeaveEmail(); if (!e) return;
  const text = `À : ${e.to}\nObjet : ${e.subject}\n\n${e.body}`;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    const old = btn.innerHTML;
    btn.innerHTML = '✓ Message copié !'; btn.style.color = '#059669'; btn.style.borderColor = '#a7f3d0';
    setTimeout(() => { btn.innerHTML = old; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
  } catch (err) {
    alert('Copie automatique impossible sur ce navigateur — sélectionnez puis copiez le message manuellement.');
  }
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
document.getElementById('leave-modal').addEventListener('click', (e) => { if (e.target.id === 'leave-modal') closeModal('leave-modal'); });
document.addEventListener('keydown', (e) => {
  const modalOpen = !document.getElementById('leave-modal').classList.contains('hidden');
  if (e.key === 'Escape') closeModal('leave-modal');
  if (!modalOpen) { if (e.key === 'ArrowLeft') prevMonth(); if (e.key === 'ArrowRight') nextMonth(); }
});

// ----- Navigation -----
function prevMonth() { if (atMin()) return; if (--currentMonth < 0) { currentMonth = 11; currentYear--; } render(); }
function nextMonth() { if (++currentMonth > 11) { currentMonth = 0; currentYear++; } render(); }
document.getElementById('prev-btn').addEventListener('click', prevMonth);
document.getElementById('next-btn').addEventListener('click', nextMonth);
document.getElementById('leave-btn').addEventListener('click', () => openLeaveModal());

// ----- Init -----
render();
